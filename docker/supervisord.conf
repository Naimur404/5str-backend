[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; ============================================================
; HTTP layer
; ============================================================

; PHP-FPM — serves the application
[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stopsignal=QUIT
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Nginx — reverse proxy to PHP-FPM
[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stopsignal=QUIT
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; Background workers
; ============================================================

; Horizon — manages all queue workers (high / default / notifications / low)
; with the supervisor topology defined in config/horizon.php.
; Replaces the legacy `queue:work` worker; one Horizon process per container
; is enough — it spawns its own worker pool internally.
[program:horizon]
command=php /var/www/html/artisan horizon
user=www-data
autostart=true
autorestart=true
; Horizon coordinates a graceful shutdown across all its workers; give it
; up to an hour so in-flight long-running jobs finish.
stopwaitsecs=3600
stopsignal=TERM
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Scheduler — runs the Laravel cron schedule every minute (`schedule:work`
; is a long-running supervisor process; no host-level cron entry needed).
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Cache invalidation listener — subscribes to the Redis pub/sub channel and
; flushes local cache tags whenever any peer container publishes an event.
; Keeps multi-instance deploys cache-coherent.
[program:cache-invalidation-listener]
command=php /var/www/html/artisan cache:invalidation-listen
user=www-data
autostart=true
autorestart=true
startretries=10
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
