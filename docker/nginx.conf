user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 100M;

    # gzip — covers JSON responses (the bulk of this app's traffic).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Hide the FastCGI temp dir under a writable path.
    fastcgi_temp_path /var/lib/nginx/fastcgi 1 2;
    proxy_temp_path   /var/lib/nginx/proxy 1 2;
    client_body_temp_path /var/lib/nginx/client_body 1 2;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Health probes shouldn't pollute the access log.
        location = /api/healthz { access_log off; try_files $uri $uri/ /index.php?$query_string; }
        location = /api/readyz  { access_log off; try_files $uri $uri/ /index.php?$query_string; }

        # Static assets — long-term cache.
        location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|ttf|otf|eot|css|js)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;

            # Keep typical responses in memory instead of spilling to disk.
            fastcgi_buffering on;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 32 32k;
            fastcgi_busy_buffers_size 64k;
        }

        # Block dotfiles except well-known paths (Let's Encrypt etc.).
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
